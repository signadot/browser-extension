version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken version has time to be caught and pulled. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The default of 5 held back most of the pending majors; 20 lets
    # Dependabot propose them all at once.
    open-pull-requests-limit: 20
    # Same one-week wait as above.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
