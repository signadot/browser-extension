version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The default of 5 held back most of the pending majors; 20 lets
    # Dependabot propose them all at once.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
